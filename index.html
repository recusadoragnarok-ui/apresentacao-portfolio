  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

2rem)/.95 Sora,sans-serif;letter-spacing:-.05em;color:#4169E1\">−56%<\u002Fspan>\n          <span style=\"background:#4169E1;color:#fff;font:600 13px/1.3 Sora,sans-serif;padding:8px 12px;border-radius:10px;max-width:16ch\">mais barato, mesma verba<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:10px;margin-top:22px\">\n          <div style=\"display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center\">\n            <span style=\"font:500 12px Montserrat,sans-serif;text-transform:uppercase;color:#5a5850\">Antes<\u002Fspan>\n            <div style=\"height:14px;background:#d9d6cc;border-radius:999px;width:100%\"><\u002Fdiv>\n            <span style=\"font:600 1.1rem Sora,sans-serif;color:#5a5850;min-width:72px;text-align:right\">R$ 5,00<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center\">\n            <span style=\"font:500 12px Montserrat,sans-serif;text-transform:uppercase;color:#0B0B0C\">Depois<\u002Fspan>\n            <div style=\"height:14px\"><div style=\"height:14px;background:#4169E1;border-radius:999px;width:44%\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"font:600 1.1rem Sora,sans-serif;color:#4169E1;min-width:72px;text-align:right\">R$ 2,20<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"color:#5a5850;text-wrap:pretty;border-top:1px solid #e2dfd5;padding-top:20px;margin-top:auto\">Resultados significativos com leads qualificados: com a mesma verba, reduzimos o CPL de R$ 5 para R$ 2,20, sem alterar a taxa de lead qualificado (MQL).<\u002Fp>\n    <\u002Farticle>\n    <article style=\"background:#0B0B0C;color:#F7F5EF;border-radius:24px;padding:clamp(24px,3.5vw,40px);display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n        <div style=\"background:#F7F5EF;border-radius:12px;padding:8px 14px;height:52px;display:flex;align-items:center\"><img src=\"0b29d57f-1616-40c5-bdeb-ee72acbdc32d\" alt=\"Logo da DM Móveis Planejados\" style=\"height:38px;width:auto\"><\u002Fdiv>\n        <span style=\"font:500 11px/1 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#a9a69c;border:1px solid #333;padding:7px 10px;border-radius:999px\">2024 → 2025<\u002Fspan>\n      <\u002Fdiv>\n      <div>\n        <div style=\"display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px\">\n          <span style=\"font:500 clamp(1.4rem,2.6vw,2rem)/1 Sora,sans-serif;color:#77756d\">R$ 1,2 mi →<\u002Fspan>\n          <span style=\"font:600 clamp(3rem,7vw,5.2rem)/.95 Sora,sans-serif;letter-spacing:-.05em;color:#8fa6ef\">R$ 4,5 mi<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:.95rem;margin-top:12px\"><span style=\"font-weight:600\">+275%<\u002Fspan> de faturamento — 3,75x em um ano<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #2a2a2a;padding-top:20px;display:grid;gap:14px;color:#cfcdc4;font-size:.95rem\">\n        <p>Responsável pelo crescimento de faturamento da empresa.<\u002Fp>\n        <p><span style=\"color:#F7F5EF;font-weight:600\">Principal alavanca:<\u002Fspan> redução do custo por lead de R$ 14 para a meta de R$ 8 (43%), sem perda de qualidade do lead, sustentada por uma esteira de testes de criativos e públicos rodando em escala.<\u002Fp>\n        <p><span style=\"color:#F7F5EF;font-weight:600\">Frentes de apoio:<\u002Fspan> Google Meu Negócio como canal de aquisição local; implementação de CRM para dar visibilidade ao funil; desenho do processo comercial, com metas claras de SLA de atendimento para o time de vendas.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Farticle>\n  <\u002Fdiv>\n  <p style=\"margin-top:20px;font-size:.85rem;color:#5a5850;display:flex;gap:10px;align-items:baseline\"><span style=\"font:500 11px Montserrat,sans-serif;color:#2c4fc4\">*<\u002Fspan>Dados específicos das campanhas são confidenciais e não podem ser compartilhados. Os resultados são apresentados em nível agregado.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"escopo\" data-screen-label=\"02 Escopo\" style=\"max-width:1200px;margin:0 auto;padding:clamp(72px,10vw,128px) clamp(20px,4vw,48px) 0\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px 64px;align-items:end;margin-bottom:clamp(36px,5vw,56px)\">\n    <div>\n      <div style=\"font:500 12px/1 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#2c4fc4;margin-bottom:18px\">02 — Escopo<\u002Fdiv>\n      <h2 style=\"font:600 clamp(2rem,4.6vw,3.6rem)/1.02 Sora,sans-serif;letter-spacing:-.04em;text-wrap:balance\">Dois pilares, uma base de mensuração<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"color:#5a5850;max-width:44ch;text-wrap:pretty\">Tudo parte de um planejamento estratégico baseado em dados, em que as decisões são guiadas pelas métricas.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px\">\n    <div style=\"border-top:2px solid #0B0B0C;padding-top:24px;display:grid;grid-template-columns:auto 1fr;gap:20px\">\n      <span style=\"font:600 clamp(2.4rem,4vw,3.2rem)/1 Sora,sans-serif;color:#4169E1;letter-spacing:-.04em\">1<\u002Fspan>\n      <div><h3 style=\"font:600 1.35rem/1.25 Sora,sans-serif;letter-spacing:-.02em;margin-bottom:10px\">Visibilidade<\u002Fh3><p style=\"color:#5a5850;text-wrap:pretty\">Estruturação de campanhas no Google, na rede Display com foco em awareness, e de campanhas no Meta com foco em ganhar seguidores.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:2px solid #0B0B0C;padding-top:24px;display:grid;grid-template-columns:auto 1fr;gap:20px\">\n      <span style=\"font:600 clamp(2.4rem,4vw,3.2rem)/1 Sora,sans-serif;color:#4169E1;letter-spacing:-.04em\">2<\u002Fspan>\n      <div><h3 style=\"font:600 1.35rem/1.25 Sora,sans-serif;letter-spacing:-.02em;margin-bottom:10px\">Audiência qualificada nas redes sociais<\u002Fh3><p style=\"color:#5a5850;text-wrap:pretty\">Estratégias de mídia paga, alinhamento com o social media e planejamento estratégico de acordo com a persona que a marca deseja alcançar.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:40px;background:#4169E1;color:#F7F5EF;border-radius:24px;padding:clamp(28px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:36px 56px;align-items:center\">\n    <div>\n      <div style=\"font:500 12px/1 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px\">Base · Tracking avançado<\u002Fdiv>\n      <h3 style=\"font:600 clamp(1.5rem,2.6vw,2rem)/1.15 Sora,sans-serif;letter-spacing:-.03em;margin-bottom:14px;text-wrap:balance\">Cada decisão de mídia tomada com dado confiável.<\u002Fh3>\n      <p style=\"text-wrap:pretty;line-height:1.6\">Construção de toda a estrutura que conecta o Google e o Meta: eventos, conversões e integrações organizados. Quando a empresa usa um CRM com API aberta, a estrutura também se conecta a ele para enviar conversões.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font:600 14px Sora,sans-serif\">\n      <div style=\"background:#F7F5EF;color:#0B0B0C;border-radius:14px;padding:18px 12px;text-align:center\">Google<\u002Fdiv>\n      <div style=\"font:500 13px Montserrat,sans-serif\">⇄<\u002Fdiv>\n      <div style=\"background:#F7F5EF;color:#0B0B0C;border-radius:14px;padding:18px 12px;text-align:center\">Meta<\u002Fdiv>\n      <div style=\"grid-column:1 / -1;display:grid;place-items:center;font:500 13px Montserrat,sans-serif;height:22px\">↓<\u002Fdiv>\n      <div style=\"grid-column:1 / -1;background:#0B0B0C;color:#F7F5EF;border-radius:14px;padding:18px 12px;text-align:center\">Eventos · Conversões · Integrações<\u002Fdiv>\n      <div style=\"grid-column:1 / -1;display:grid;place-items:center;font:500 13px Montserrat,sans-serif;height:22px\">↓<\u002Fdiv>\n      <div style=\"grid-column:1 / -1;border:1.5px dashed rgba(247,245,239,.7);border-radius:14px;padding:16px 12px;text-align:center;font-weight:500\">CRM com API aberta <span style=\"font:400 12px Montserrat,sans-serif;opacity:.85\">(se houver)<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:16px;border:1px solid #e2dfd5;background:#fff;border-radius:24px;padding:clamp(24px,3.5vw,36px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px 48px\">\n    <h3 style=\"font:600 1.2rem/1.3 Sora,sans-serif;letter-spacing:-.02em\">Orientação para o próximo nível<\u002Fh3>\n    <p style=\"color:#5a5850;text-wrap:pretty\">Ao longo do acompanhamento, identifico o que a empresa precisa estruturar para evoluir, como um CRM, um site ou outras frentes de apoio, e sinalizo essas necessidades com clareza. A implementação dessas frentes não faz parte deste serviço.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"entregas\" data-screen-label=\"03 Entregas\" style=\"max-width:1200px;margin:0 auto;padding:clamp(72px,10vw,128px) clamp(20px,4vw,48px) 0\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px 64px;align-items:end;margin-bottom:clamp(36px,5vw,56px)\">\n    <div>\n      <div style=\"font:500 12px/1 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#2c4fc4;margin-bottom:18px\">03 — Entregas<\u002Fdiv>\n      <h2 style=\"font:600 clamp(2rem,4.6vw,3.6rem)/1.02 Sora,sans-serif;letter-spacing:-.04em;text-wrap:balance\">O que está incluído<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"color:#5a5850;max-width:44ch;text-wrap:pretty\">O serviço se limita à mídia paga e à estrutura de tráfego pago, incluindo as auditorias mensais dos resultados e das estratégias.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));column-gap:48px;border-top:2px solid #0B0B0C\">\n    <sc-for list=\"{{ entregas }}\" as=\"e\" hint-placeholder-count=\"6\">\n      <div style=\"display:grid;grid-template-columns:48px 1fr;gap:16px;padding:24px 0;border-bottom:1px solid #e2dfd5\">\n        <span style=\"font:500 13px/1.7 Montserrat,sans-serif;color:#2c4fc4\">{{ e.n }}<\u002Fspan>\n        <div><h3 style=\"font:600 1.1rem/1.3 Sora,sans-serif;letter-spacing:-.015em;margin-bottom:6px\">{{ e.t }}<\u002Fh3><p style=\"color:#5a5850;font-size:.95rem\">{{ e.d }}<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"processo\" data-screen-label=\"04 Processo\" style=\"max-width:1200px;margin:0 auto;padding:clamp(72px,10vw,128px) clamp(20px,4vw,48px) 0\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px 64px;align-items:end;margin-bottom:clamp(36px,5vw,56px)\">\n    <div>\n      <div style=\"font:500 12px/1 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#2c4fc4;margin-bottom:18px\">04 — Processo<\u002Fdiv>\n      <h2 style=\"font:600 clamp(2rem,4.6vw,3.6rem)/1.02 Sora,sans-serif;letter-spacing:-.04em;text-wrap:balance\">Como trabalhamos<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"color:#5a5850;max-width:44ch;text-wrap:pretty\">Quatro etapas, da persona à otimização contínua.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px\">\n    <sc-for list=\"{{ etapas }}\" as=\"s\" hint-placeholder-count=\"4\">\n      <div style=\"background:#fff;border:1px solid #e2dfd5;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:40px;min-height:260px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          <span style=\"width:40px;height:40px;border-radius:50%;background:#4169E1;color:#fff;display:grid;place-items:center;font:600 15px Sora,sans-serif\">{{ s.n }}<\u002Fspan>\n          <span style=\"font:500 11px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#5a5850\">Etapa {{ s.n }}/4<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto\"><h3 style=\"font:600 1.2rem/1.25 Sora,sans-serif;letter-spacing:-.02em;margin-bottom:8px\">{{ s.t }}<\u002Fh3><p style=\"color:#5a5850;font-size:.95rem;text-wrap:pretty\">{{ s.d }}<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"margin-top:56px\">\n    <div style=\"font:500 12px/1 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#0B0B0C;margin-bottom:20px\">As primeiras quatro semanas<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0 24px\">\n      <sc-for list=\"{{ semanas }}\" as=\"w\" hint-placeholder-count=\"4\">\n        <div style=\"border-top:3px solid #4169E1;padding:18px 0 24px\">\n          <div style=\"font:600 1rem Sora,sans-serif;color:#2c4fc4;margin-bottom:8px\">{{ w.t }}<\u002Fdiv>\n          <p style=\"color:#3a3934;font-size:.95rem;text-wrap:pretty\">{{ w.d }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"credenciais\" data-screen-label=\"05 Credenciais\" style=\"max-width:1200px;margin:0 auto;padding:clamp(72px,10vw,128px) clamp(20px,4vw,48px) clamp(72px,10vw,128px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px 64px;align-items:end;margin-bottom:clamp(36px,5vw,56px)\">\n    <div>\n      <div style=\"font:500 12px/1 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#2c4fc4;margin-bottom:18px\">05 — Credenciais e parceiros<\u002Fdiv>\n      <h2 style=\"font:600 clamp(2rem,4.6vw,3.6rem)/1.02 Sora,sans-serif;letter-spacing:-.04em;text-wrap:balance\">Certificado pelo Google<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"color:#5a5850;max-width:44ch;text-wrap:pretty\">Certificações emitidas pelo Google Digital Academy (Skillshop).<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px\">\n    <sc-for list=\"{{ creds }}\" as=\"c\" hint-placeholder-count=\"2\">\n      <div style=\"background:#fff;border:1px solid #e2dfd5;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:20px\">\n        <img src=\"fdf1b69e-bfc5-441c-af9e-1de529808780\" alt=\"Google Certifications\" style=\"height:34px;width:auto;align-self:flex-start\">\n        <div>\n          <h3 style=\"font:600 1.2rem/1.25 Sora,sans-serif;letter-spacing:-.02em;margin-bottom:8px\">{{ c.t }}<\u002Fh3>\n          <p style=\"color:#5a5850;font-size:.92rem\">Emitido em out. de 2026 · Expira em out. de 2027<\u002Fp>\n          <p style=\"font:500 13px Montserrat,sans-serif;margin-top:6px;color:#0B0B0C\">ID {{ c.id }}<\u002Fp>\n        <\u002Fdiv>\n        <a href=\"{{ c.url }}\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:auto;align-self:flex-start;font:600 14px Sora,sans-serif;color:#0B0B0C;border:1px solid #0B0B0C;border-radius:999px;padding:10px 18px\" style-hover=\"background:#0B0B0C;color:#F7F5EF\">Exibir credencial ↗<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"background:#0B0B0C;color:#F7F5EF;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font:500 12px/1 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#8fa6ef\">Parceiros · CRM<\u002Fdiv>\n      <p style=\"color:#cfcdc4;font-size:.95rem\">Plataformas de CRM parceiras, integráveis ao tracking.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto\">\n        <div style=\"background:#F7F5EF;border-radius:14px;height:88px;display:grid;place-items:center;padding:14px\"><img src=\"5d8922cf-7cc7-41ff-8523-d3eb6a131264\" alt=\"Kommo\" style=\"max-height:56px;max-width:100%;border-radius:10px\"><\u002Fdiv>\n        <div style=\"background:#F7F5EF;border-radius:14px;height:88px;display:grid;place-items:center;padding:14px\"><img src=\"952d77aa-6622-4136-9699-6297b54a3818\" alt=\"Zoho\" style=\"max-height:40px;max-width:100%\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"investimento\" data-screen-label=\"06 Investimento\" style=\"background:#0B0B0C;color:#F7F5EF\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(72px,10vw,128px) clamp(20px,4vw,48px)\">\n    <div style=\"font:500 12px/1 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#8fa6ef;margin-bottom:18px\">06 — Investimento<\u002Fdiv>\n    <h2 style=\"font:600 clamp(2rem,4.6vw,3.6rem)/1.02 Sora,sans-serif;letter-spacing:-.04em;max-width:18ch;text-wrap:balance\">Entregas desde a primeira semana.<\u002Fh2>\n    <p style=\"color:#cfcdc4;max-width:56ch;margin-top:18px;text-wrap:pretty\">Mídia paga e estrutura de tráfego pago, com acompanhamento contínuo e auditoria mensal dos resultados.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-top:clamp(36px,5vw,56px)\">\n      <div style=\"background:#4169E1;border-radius:24px;padding:clamp(28px,4vw,44px);display:flex;flex-direction:column;gap:20px\">\n        <div style=\"font:500 12px/1 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em\">Acompanhamento de tráfego pago<\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\"><span style=\"font:600 clamp(3.4rem,8vw,6rem)/.9 Sora,sans-serif;letter-spacing:-.05em\">R$ 1.750<\u002Fspan><span style=\"font-size:1rem\">/ mês<\u002Fspan><\u002Fdiv>\n        <div style=\"border-top:1px solid rgba(247,245,239,.4);padding-top:18px;display:grid;gap:10px;font-size:.95rem\">\n          <sc-for list=\"{{ continuas }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:18px 1fr;gap:10px\"><span>—<\u002Fspan><span>{{ c }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:16px;align-content:start\">\n        <div style=\"border:1px solid #333;border-radius:24px;padding:clamp(24px,3.5vw,36px)\">\n          <div style=\"font:500 12px/1 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#a9a69c;margin-bottom:16px\">Verba de mídia sugerida<\u002Fdiv>\n          <div style=\"font:600 clamp(2rem,4vw,2.8rem)/1 Sora,sans-serif;letter-spacing:-.04em\">Mínimo de R$ 2.000<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;margin:18px 0 14px\"><span style=\"border:1px solid #F7F5EF;border-radius:999px;padding:4px 14px;font-size:.85rem\">Meta<\u002Fspan><span style=\"border:1px solid #F7F5EF;border-radius:999px;padding:4px 14px;font-size:.85rem\">Google<\u002Fspan><\u002Fdiv>\n          <p style=\"color:#a9a69c;font-size:.9rem\">Dividida entre as duas plataformas. A verba é um valor à parte do acompanhamento.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #333;border-radius:24px;padding:clamp(24px,3.5vw,36px)\">\n          <h3 style=\"font:600 1.05rem Sora,sans-serif;margin-bottom:8px\">Limites do serviço<\u002Fh3>\n          <p style=\"color:#a9a69c;font-size:.9rem;text-wrap:pretty\">O serviço se limita à mídia paga e à estrutura de tráfego pago, incluindo as auditorias mensais. A implementação de outras frentes, como CRM ou site, não faz parte do escopo.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #333;border-radius:24px;padding:clamp(24px,3.5vw,36px)\">\n          <h3 style=\"font:600 1.05rem Sora,sans-serif;margin-bottom:8px\">Confidencialidade<\u002Fh3>\n          <p style=\"color:#a9a69c;font-size:.9rem;text-wrap:pretty\">As campanhas, o investimento e a estratégia de cada marca nunca são divulgados.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:clamp(56px,8vw,96px);padding-top:32px;border-top:1px solid #333;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px\">\n      <p style=\"font:600 clamp(1.4rem,3vw,2.2rem)/1.15 Sora,sans-serif;letter-spacing:-.03em;max-width:20ch\">Vamos começar na próxima semana?<\u002Fp>\n      <div data-noprint=\"\" style=\"display:flex;gap:10px;flex-wrap:wrap\">\n        <a href=\"https://www.linkedin.com/in/bruno-alc\" target=\"_blank\" rel=\"noopener\" style=\"background:#4169E1;color:#fff;font:600 15px Sora,sans-serif;padding:16px 26px;border-radius:999px\" style-hover=\"background:#F7F5EF;color:#0B0B0C\">Falar com Bruno →<\u002Fa>\n        <button sc-camel-on-click=\"{{ imprimir }}\" style=\"background:transparent;color:#F7F5EF;font:600 15px Sora,sans-serif;padding:15px 26px;border-radius:999px;border:1px solid #555;cursor:pointer\" style-hover=\"border-color:#F7F5EF\">Salvar em PDF<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <footer style=\"border-top:1px solid #222\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:24px clamp(20px,4vw,48px);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font:500 12px/1.4 Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#77756d\">\n      <span>Bruno Alcântara · Mídia paga e tracking<\u002Fspan><span>Manaus, Amazonas · 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;animarMarcas&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const c = 'assets/marca-confidencial.webp';\n    const marcas = [\n      ['Vibe Sales','assets/vibe-sales.webp'],['Natura Belas','assets/natura-belas.webp'],\n      ['Capsfarma','assets/capsfarma.webp'],['Todabella','assets/todabella.webp'],\n      ['iPhone4You','assets/iphone4you.webp'],['DM Móveis Planejados','assets/dm-moveis-planejados.webp'],\n      ['Fighter Store','assets/fighter-store.webp'],['HD Print','assets/hd-print.webp'],['RioPet Gávea','assets/riopet-gavea.webp']\n    ].map(([nome, src]) => ({ nome, src }));\n    const animar = this.props.animarMarcas ?? true;\n    return {\n      animar, estatico: !animar,\n      entregas: [\n        ['Gestão de tráfego pago','Condução das campanhas nas plataformas de tráfego pago, com foco em Google e Meta.'],\n        ['Setup de campanhas','Estrutura de contas e campanhas, junto com o tracking que conecta Google e Meta.'],\n        ['Estratégia de tráfego pago','Planejamento de acordo com a persona e os objetivos da marca.'],\n        ['Roteiros semanais para criativos','Direcionamentos de roteiro toda semana para a gravação dos criativos.'],\n        ['Acompanhamento semanal','Relatório semanal com os resultados, as otimizações e os ajustes feitos.'],\n        ['Auditoria mensal','Auditoria dos resultados e das estratégias, com os resultados enviados ao cliente.']\n      ].map(([t, d], i) => ({ n: String(i + 1).padStart(2, '0'), t, d })),\n      etapas: [\n        ['Diagnóstico','Entendemos a marca, o público que ela quer alcançar e os dados e contas que já existem.'],\n        ['Estrutura e tracking','Montamos a estrutura de contas e campanhas e construímos o tracking, conectando Google e Meta.'],\n        ['Campanhas no ar','Testes de criativos e de públicos, alinhados com o time interno da empresa.'],\n        ['Acompanhamento e otimização','Acompanhamento diário, relatório semanal, otimizações e os ajustes necessários na estratégia.']\n      ].map(([t, d], i) => ({ n: i + 1, t, d })),\n      semanas: [\n        ['Semana 1','Relatório auditando tudo o que já foi feito e como funciona o funil da empresa; direcionamento de criativo; campanhas rodando.'],\n        ['Semana 2','Planejamento completo, com os próximos passos e a estratégia
